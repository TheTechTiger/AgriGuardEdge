; AgriGuard Edge — ESP32-S3 N16R8 + ST7735 128x160 + TFT_eSPI + LVGL 9
;
; Display stack inherited from sketchbook/DeskBuddy, adapted. See docs/architechture.md §6.6.
; Three deliberate deviations from DeskBuddy, all documented in the arch doc:
;   1. -DTFT_BL=9   (DeskBuddy uses -1, i.e. LED tied to 3V3 -> ~1699 mAh/day)
;   2. SPI 20 MHz   (DeskBuddy 40 MHz; breadboard jumpers cannot carry 40 cleanly)
;   3. PSRAM opi    (DeskBuddy was a plain esp32dev with no PSRAM)

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Adjust to whatever the board enumerates as:
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; ---- Flash / PSRAM (16 MB flash, 8 MB octal PSRAM) ----
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; ---- Partition table ----
board_build.partitions = partitions_custom.csv

; ---- Libraries ----
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^9.2.2
  bblanchon/ArduinoJson@^7.4.2

; ---- TFT_eSPI configured via build flags (no User_Setup.h editing) ----
; TFT wiring: SCK=12, MOSI=11, DC=13, RST=14, CS=10, BL=9 (PWM)
;            VCC->3V3, GND->GND
build_flags =
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_SUPPORT=1
  -Iinclude
  -I$PROJECT_DIR/../firmware/common
  -DUSER_SETUP_LOADED=1
  -DST7735_DRIVER=1
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=160
  -DST7735_BLACKTAB=1
  -DTFT_RGB_ORDER=1
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=13
  -DTFT_RST=14
  -DTFT_BL=9
  -DTFT_MISO=-1
  -DSPI_FREQUENCY=20000000
  -DSPI_READ_FREQUENCY=8000000
  -DUSE_DMA=1
  -DLOAD_FONT2=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DLV_CONF_INCLUDE_SIMPLE=1