{% extends "base.html" %}
{% block title%}
Periodic Irrigation
{% endblock %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Irrigation Control-Periodic Irrigation</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
        <li class="breadcrumb-item active">Irrigation Control</li>
        <li class="breadcrumb-item active">Periodic Irrigation</li>
      </ol>
    </nav>
  </div>
  <!-- End Page Title -->

  <section class="section">
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Periodic Irrigation</h5>

            <!-- Default Tabs -->

            <div class="tab-content pt-2" id="myTabjustifiedContent">
              <div class="tab-pane fade show active" id="home-justified" role="tabpanel" aria-labelledby="home-tab">
                <!-- Vertical Form -->
                <form class="row g-3" action="/periodic-irrigation" method="post" id="periodic-irrigation-form">

                  <div class="col-12">

                    <label for="planName" class="form-label"data-bs-toggle="tooltip" data-bs-placement="right"
                      data-bs-original-title="Name your irrigation plan for easy
                      identification.">
                      Name
                    </label>
                    <input type="text" class="form-control" id="planName" required name="planName"><br>

                    <label for="frequencySelect" class="form-label" data-bs-toggle="tooltip" data-bs-placement="right"
                      data-bs-original-title="Select the frequency of your irrigation schedule.">Frequency</label>
                    <select id="frequencySelect" required name="frequency" class="form-select">
                      <option value="daily">Daily</option>
                      <option value="mon-fri">Mon to Fri</option>
                      <option value="custom">Custom</option>
                    </select>
                  </div>

                  <div class="row mb-3" id="customDaysContainer" style="display: none;">
                    <label class="col-sm-2 col-form-label">Select Days</label>

                    <div class="col-sm-10">
                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day0" value="sunday" type="checkbox" id="sunday_input">
                        <label class="form-check-label" for="sunday_input">Sunday</label>
                      </div>

                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day1" value="monday" type="checkbox" id="monday_input">
                        <label class="form-check-label" for="monday_input">Monday</label>
                      </div>

                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day2" value="tuesday" type="checkbox" id="tuesday_input">
                        <label class="form-check-label" for="tuesday_input">Tuesday</label>
                      </div>

                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day3" value="wednesday" type="checkbox"
                          id="wednesday_input">
                        <label class="form-check-label" for="wednesday_input">Wednesday</label>
                      </div>

                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day4" value="thursday" type="checkbox"
                          id="thursday_input">
                        <label class="form-check-label" for="thursday_input">Thursday</label>
                      </div>

                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day5" value="friday" type="checkbox" id="friday_input">
                        <label class="form-check-label" for="friday_input">Friday</label>
                      </div>

                      <div class="form-check form-switch">
                        <input class="form-check-input" name="day6" value="saturday" type="checkbox"
                          id="saturday_input">
                        <label class="form-check-label" for="saturday_input">Saturday</label>
                      </div>
                    </div>
                  </div>



              </div><br>

              <div class="col-12">
                <label for="start_time" class="form-label" data-bs-toggle="tooltip" data-bs-placement="right"
                      data-bs-original-title="Select the time when your irrigation schedule will start.">Start Time</label>
                <input type="time" class="form-control" id="start_time" name="start_time" step="60" required="">
              </div><br>

              <div class="col-12" id="start_onwards_date">
                <label for="start_onwards_date" class="col-sm-2 col-form-label" data-bs-toggle="tooltip" data-bs-placement="right"
                      data-bs-original-title="Select the date from which your irrigation schedule will start.">Start Onwards Date</label>
                <div class="col-sm-12">
                  <input type="date" class="form-control">
                </div>
              </div><br>

              <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <label for="duration" class="form-label mb-0" data-bs-toggle="tooltip" data-bs-placement="right"
                        data-bs-original-title="Select the duration of each irrigation session.">Duration</label>
                      <select name="unit" id="unit" class="form-select w-auto">
                        <option value="minutes" selected>Minutes</option>
                        <option value="seconds">Seconds</option>
                      </select>
                    </div>
                    <input type="range" name="duration" class="form-range" id="duration" required min="1" max="180"
                      step="1" value="30" aria-valuenow="30" />
                    <div class="mt-2 range-display">
                      <small>Selected duration:
                        <span class="duration">30</span> <span id="unit-display">min</span></small>
                    </div>
                  </div><br>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="ensureStrictness" name="ensureStrictness">
                    <label class="form-check-label" for="ensureStrictness" data-bs-toggle="tooltip" data-bs-placement="right"
                      data-bs-original-title="Enable this option to ensure your irrigation schedule is followed strictly.">
                      Ensure Strictness
                    </label>
                  </div>
                </div>

              </div>
              
              <div class="text-center">
                <button type="submit" class="btn btn-primary" id="saveRule">
                  Save Rule
                </button>
                <button type="reset" class="btn btn-secondary" id="resetRule">
                  Reset
                </button>
              </div>
              </form>
              <!-- Vertical Form -->
            </div>

  </section>
</main>
<script>
  const frequencySelect = document.getElementById("frequencySelect");
  const customDaysContainer = document.getElementById("customDaysContainer");
  const saveBtn = document.getElementById("saveRule");


  frequencySelect.addEventListener("change", function () {
    if (this.value === "custom") {
      customDaysContainer.style.display = "block";
    } else {
      customDaysContainer.style.display = "none";
    }

  });

  const durationSlider = document.getElementById('duration');
  const durationDisplay = document.querySelector('.duration');
  const unitSelect = document.getElementById('unit');
  const unitDisplay = document.getElementById('unit-display');

  function updateSliderBackground() {
    const value = durationSlider.value;
    const min = parseFloat(durationSlider.min);
    const max = parseFloat(durationSlider.max);
    const percent = ((value - min) / (max - min)) * 100;
    durationSlider.style.setProperty("--percent", percent + "%");
  }

  // Update display and styling on slider input
  durationSlider.addEventListener('input', function () {
    durationDisplay.textContent = this.value;
    this.setAttribute('aria-valuenow', this.value);
    updateSliderBackground();
  });

  unitSelect.addEventListener('change', function () {
    if (this.value === 'seconds') {
      durationSlider.min = 5;
      durationSlider.max = 60;
      durationSlider.step = 5;
      durationSlider.value = 30;
      unitDisplay.textContent = 'sec';
    } else {
      durationSlider.min = 1;
      durationSlider.max = 180;
      durationSlider.step = 1;
      durationSlider.value = 30;
      unitDisplay.textContent = 'min';
    }
    durationDisplay.textContent = durationSlider.value;
    durationSlider.setAttribute('aria-valuenow', durationSlider.value);
    updateSliderBackground();
  });

  document.addEventListener("DOMContentLoaded", function () {
    const startNow = document.getElementById("startNow");
    const scheduleLater = document.getElementById("scheduleLater");
    const dateField = document.getElementById("select_date");

    const style = document.createElement("style");
    style.innerHTML = `
    #duration::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 10px;
        background: linear-gradient(to right, #4e6ddf var(--percent), #dee2e6 var(--percent));
    }

    #duration::-moz-range-track {
        height: 8px;
        border-radius: 10px;
        background: linear-gradient(to right, #4e6ddf var(--percent), #dee2e6 var(--percent));
    }
`;
    document.head.appendChild(style);

    updateSliderBackground();
  });
</script>





{% endblock %}
