<script>

  function triggerUpload() {
    document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", function() {
    let file = this.files[0];
    if (!file) return;

    let formData = new FormData();
    formData.append("file", file);

    fetch("/profilePic", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);

        // 🔥 Refresh image after upload (avoid caching)
        document.getElementById("profileImg").src = "/profilePic?" + new Date().getTime();
    });
});

function deletePic() {
    fetch("/profilePic", {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);

    // 🔥 Refresh image after delete (use server route to get default)
    document.getElementById("profileImg").src = "/profilePic?" + new Date().getTime();
    });
}

  const stateSelect = document.getElementById("stateSelect");
  const districtSelect = document.getElementById("districtSelect");
  // districtSelect.disabled = true;

  stateSelect.addEventListener("change", function () {
    const state = this.value;
    districtSelect.innerHTML = '<option value="">Select District</option>';

    if (stateDistrictMap[state]) {
      stateDistrictMap[state].forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
    }
  });

  // ESP Status Badge Update
  document.addEventListener("DOMContentLoaded", () => {
    const espBadge = document.getElementById("espBadge");

    const setBadge = (el, text, cls) => {
      if (!el) return;
      el.className = "badge " + cls;
      el.textContent = text;
    };

    function updateEspStatus(val) {
      if (val == 1) setBadge(espBadge, "Online", "bg-success");
      else setBadge(espBadge, "Offline", "bg-danger");
    }

    function checkEspData() {
      fetch("/api/status")
        .then((response) => response.json())
        .then((data) => {
          updateEspStatus(data.online ? 1 : 0);
        })
        .catch((error) => {
          console.error("Error fetching node status:", error);
        });
    }
    checkEspData();
    setInterval(checkEspData, 60000);
  });

  // Notification Settings Toggle Logic

  const masterToggle = document.getElementById('notifyAll');
  const masterLabel = document.getElementById('masterLabel');
  const notificationToggles = document.querySelectorAll('.notification-toggle');

  masterToggle.addEventListener('change', function () {
    if (this.checked) {
      // Subscribe → check all
      notificationToggles.forEach(toggle => {
        toggle.checked = true;
        toggle.blur();
      });

      masterLabel.textContent = 'Unsubscribe from all notifications';
    } else {
      // Unsubscribe → uncheck all
      notificationToggles.forEach(toggle => {
        toggle.checked = false;
        toggle.focus();
      });

      masterLabel.textContent = 'Subscribe to all notifications';
    }
  });

  notificationToggles.forEach(toggle => {
    toggle.addEventListener('change', () => {
      const allChecked = [...notificationToggles].every(t => t.checked);

      masterToggle.checked = allChecked;
      masterLabel.textContent = allChecked
        ? 'Unsubscribe from all notifications'
        : 'Subscribe to all notifications';
    });
  });

</script>

{% endblock %}
