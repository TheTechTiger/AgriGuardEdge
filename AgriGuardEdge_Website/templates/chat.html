{% extends "base.html" %} {% block title%} Dashboard {% endblock %} {% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Chat With Krishimitra</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active">Chat With Krishimitra</li>
      </ol>
    </nav>
  </div>

  <section class="section">
    <div class="card">
      <div class="card-body">
    <div class="row flex-nowrap" style="height: 70vh">
      <!-- TOGGLE BUTTON (ALWAYS VISIBLE) -->
      <div class="col-auto border-end d-flex align-items-start p-2">
        <button
          class="btn btn-outline-secondary bg-success"
          id="toggleHistoryBtn"
        >
          <i class="bi bi-layout-sidebar-reverse text-white"></i>
        </button>
      </div>

      <!-- SIDEBAR (HIDDEN BY DEFAULT) -->
      <div
        class="col-md-3 border-end d-none pt-2 position-md-static bg-white"
  id="sidebarCol"
  style="width:260px; z-index:1050;"
      >
        <input
          type="text"
          class="form-control mb-2"
          id="chatSearch"
          placeholder="Search chats..."
        />

        <button class="btn btn-success w-100 mb-3" id="newChatBtn">
          <i class="bi bi-plus-circle"></i> New Chat
        </button>

        <div
          class="list-group overflow-auto"
          id="chatHistory"
          style="max-height: 55vh"
        ></div>
      </div>

      <!-- CHAT AREA -->
      <div class="col d-flex flex-column ms-md-0" id="chatCol">
        <div class="flex-grow-1 overflow-auto" id="chatMessages"></div>

        <div class="input-group mt-3">
          <textarea
            class="form-control border-success"
            id="chatInput"
            rows="1"
            placeholder="Ask Krishimitra..."
          ></textarea>

          <button class="btn btn-success" onclick="sendMessage()">
            <i class="bi bi-send"></i>
          </button>
        </div>
      </div>
    </div>
    </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .cursor-blink { animation: blink 0.7s step-start infinite; color: #198754; font-weight: bold; }
  /* Markdown rendered content styles */
  .md-content p { margin-bottom: 0.4rem; }
  .md-content ul, .md-content ol { padding-left: 1.2rem; margin-bottom: 0.4rem; }
  .md-content code { background: rgba(0,0,0,0.08); padding: 1px 4px; border-radius: 3px; font-size: 0.88em; }
  .md-content pre { background: rgba(0,0,0,0.08); padding: 0.5rem; border-radius: 6px; overflow-x: auto; }
  .md-content pre code { background: none; padding: 0; }
  .md-content a { color: #146c43; text-decoration: underline; }
  .md-content blockquote { border-left: 3px solid #198754; margin: 0 0 0.4rem; padding-left: 0.6rem; color: #555; }
  .md-content h1, .md-content h2, .md-content h3 { font-size: 1rem; font-weight: 700; margin: 0.3rem 0; }
</style>

<script>
  /* ===================== STATE ===================== */
  let chats = {};
  let currentChatId = null;

  function saveChats() {
    if (!currentChatId || !chats[currentChatId]) return;
    fetch("/api/chat/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: currentChatId,
        chat_data: chats[currentChatId]
      })
    }).catch(e => console.error("Failed to sync chat", e));
  }

  // ===== Chat History Search =====
  document.getElementById("chatSearch").addEventListener("input", (e) => {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll("#chatHistory .list-group-item").forEach((item) => {
      const text = item.textContent.toLowerCase();
      item.style.display = text.includes(query) ? "block" : "none";
    });
  });

  // ===== Sidebar Expand / Collapse =====
  let sidebarOpen = false; // CLOSED BY DEFAULT
  document.getElementById("toggleHistoryBtn").addEventListener("click", () => {
    const sidebar = document.getElementById("sidebarCol");
    sidebar.classList.toggle("d-none");
    sidebarOpen = !sidebarOpen;
  });

  /* ===================== CHAT CREATION ===================== */
  function createChat(title = "New Chat", messages = null) {
    const id = Date.now().toString();
    chats[id] = {
      title,
      messages: messages || [{ sender: "bot", text: "Hello! I’m Krishimitra 🌱 How can I help?" }],
    };
    
    appendChatToList(id, chats[id].title);
    setActiveChat(id);
    renderMessages(id);
    saveChats();
  }

  function appendChatToList(id, title) {
    const history = document.getElementById("chatHistory");
    history.insertAdjacentHTML(
      "afterbegin",
      `
  <div class="list-group-item d-flex justify-content-between align-items-center"
       data-chat-id="${id}">
    <span class="chat-title text-truncate" style="cursor:pointer;">
      💬 ${title}
    </span>
    <i class="bi bi-trash text-success delete-chat"
       style="cursor:pointer;"></i>
  </div>
  `
    );
  }

  /* ===================== ACTIVE CHAT ===================== */
  function setActiveChat(chatId) {
    document.querySelectorAll("#chatHistory .list-group-item").forEach((item) =>
      item.classList.remove("alert", "alert-success", "text-success-emphasis", "border-success", "fw-semibold")
    );
    const active = document.querySelector(`[data-chat-id="${chatId}"]`);
    if (active) {
      active.classList.add("alert", "alert-success", "text-success-emphasis", "border-success", "fw-semibold");
    }
    currentChatId = chatId;
    saveChats();
  }

  /* ===================== RENDER ===================== */
  // Configure marked: safe links, line breaks
  marked.setOptions({ breaks: true, gfm: true });

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderMarkdown(text) {
    return marked.parse(text);
  }

  function renderMessages(chatId) {
    const box = document.getElementById("chatMessages");
    box.innerHTML = "";
    if (!chats[chatId]) return;

    chats[chatId].messages.forEach((msg) => {
      if (msg.sender === "user") {
        box.insertAdjacentHTML("beforeend",
          `<div class="d-flex justify-content-end mb-2">
           <div class="alert alert-success d-inline-block mb-0 mt-2 py-2 px-3 text-break" style="max-width:75%;">
             ${escapeHtml(msg.text)}
           </div>
         </div>`
        );
      } else {
        box.insertAdjacentHTML("beforeend",
          `<div class="d-flex mb-2">
           <div class="alert alert-info d-inline-block mb-0 mt-2 py-2 px-3" style="max-width:75%;">
             <span style="font-size:1.1em;">🤖</span>
             <div class="md-content">${renderMarkdown(msg.text)}</div>
           </div>
         </div>`
        );
      }
    });
    box.scrollTop = box.scrollHeight;
  }

  /* ===================== THINKING ===================== */
  function showThinking() {
    const box = document.getElementById("chatMessages");
    box.insertAdjacentHTML("beforeend",
      `<div class="d-flex mb-2" id="thinking">
       <div class="alert alert-info d-inline-block mb-0 py-2 px-3">
         🤖 Thinking<span id="dots">.</span>
       </div>
     </div>`
    );
    let dots = document.getElementById("dots");
    let count = 1;
    const interval = setInterval(() => {
      if(dots) dots.textContent = ".".repeat(count % 4 || 1);
      count++;
    }, 400);
    box.scrollTop = box.scrollHeight;
    return interval;
  }

  function removeThinking(interval) {
    clearInterval(interval);
    const t = document.getElementById("thinking");
    if (t) t.remove();
  }

  /* ===================== SEND MESSAGE ===================== */
  async function sendMessage() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text || !currentChatId) return;

    const chat = chats[currentChatId];

    /* store user message */
    chat.messages.push({ sender: "user", text });

    /* auto title (first user msg only) */
    if (chat.title === "New Chat") {
      chat.title = text.slice(0, 30) + (text.length > 30 ? "..." : "");
      const chatItem = document.querySelector(`[data-chat-id="${currentChatId}"]`);
      if (chatItem) {
        const titleSpan = chatItem.querySelector(".chat-title");
        if (titleSpan) titleSpan.textContent = `💬 ${chat.title}`;
      }
    }

    input.value = "";
    chatInput.style.height = "auto";
    saveChats();
    renderMessages(currentChatId);

    /* Show thinking indicator */
    const thinkingInterval = showThinking();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          chat_id: currentChatId,
          history: chats[currentChatId].messages
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      /* Remove thinking, inject a live streaming bot bubble */
      removeThinking(thinkingInterval);
      const box = document.getElementById("chatMessages");
      const bubbleId = "stream-bubble-" + Date.now();
      box.insertAdjacentHTML("beforeend",
        `<div class="d-flex mb-2" id="${bubbleId}">
           <div class="alert alert-info d-inline-block mb-0 mt-2 py-2 px-3" style="max-width:75%;">
             <span style="font-size:1.1em;">🤖</span>
             <div class="md-content stream-md"></div>
             <span class="cursor-blink">▍</span>
           </div>
         </div>`
      );
      box.scrollTop = box.scrollHeight;

      const streamMd  = document.querySelector(`#${bubbleId} .stream-md`);
      const cursor    = document.querySelector(`#${bubbleId} .cursor-blink`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullText = "";
      let renderTimer = null;

      // Throttled markdown re-render so we don't thrash the DOM on every token
      function scheduleRender() {
        if (renderTimer) return;
        renderTimer = requestAnimationFrame(() => {
          renderTimer = null;
          streamMd.innerHTML = renderMarkdown(fullText);
          box.scrollTop = box.scrollHeight;
        });
      }

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          try {
            const evt = JSON.parse(line.slice(6));
            if (evt.type === "token") {
              fullText += evt.text;
              scheduleRender();
            } else if (evt.type === "done") {
              break;
            } else if (evt.type === "error") {
              fullText = "**Error:** " + evt.message;
              scheduleRender();
            }
          } catch (_) {}
        }
      }

      /* Final render + remove blinking cursor */
      streamMd.innerHTML = renderMarkdown(fullText);
      if (cursor) cursor.remove();

      /* Save final message to history */
      chat.messages.push({ sender: "bot", text: fullText || "No response received." });
      saveChats();

    } catch (err) {
      removeThinking(thinkingInterval);
      chat.messages.push({ sender: "bot", text: "Sorry, something went wrong. Please try again." });
      saveChats();
      renderMessages(currentChatId);
    }
  }

  /* ===================== EVENTS ===================== */
  document.getElementById("chatHistory").addEventListener("click", (e) => {
    // DELETE CHAT
    if (e.target.classList.contains("delete-chat")) {
      e.stopPropagation(); // prevent triggering switch chat
      const item = e.target.closest(".list-group-item");
      const chatId = item.dataset.chatId;

      delete chats[chatId];
      item.remove();
      
      // Delete from backend asynchronously
      fetch(`/api/chat/${chatId}`, { method: "DELETE" }).catch(err => console.error(err));

      // If deleted chat was active
      if (currentChatId === chatId) {
        const next = document.querySelector("#chatHistory .list-group-item");
        if (next) {
          const nextId = next.dataset.chatId;
          setActiveChat(nextId);
          renderMessages(nextId);
        } else {
          createChat();
        }
      }
      return;
    }

    // SWITCH CHAT
    const item = e.target.closest(".list-group-item");
    if (!item) return;
    const chatId = item.dataset.chatId;
    setActiveChat(chatId);
    renderMessages(chatId);
  });

  document.getElementById("newChatBtn").addEventListener("click", () => createChat());

  // ===== Auto-expand textarea with max height & scrollbar =====
  const chatInput = document.getElementById("chatInput");
  const MAX_TEXTAREA_HEIGHT = 150;

  chatInput.addEventListener("input", function () {
    this.style.height = "auto";
    if (this.scrollHeight <= MAX_TEXTAREA_HEIGHT) {
      this.style.height = this.scrollHeight + "px";
      this.style.overflowY = "hidden";
    } else {
      this.style.height = MAX_TEXTAREA_HEIGHT + "px";
      this.style.overflowY = "auto";
    }
  });

  /* ===== Enter to Send | Shift+Enter for New Line ===== */
  chatInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ===================== INIT ===================== */
  async function loadChats() {
    try {
      const response = await fetch("/api/chats");
      if (!response.ok) throw new Error("Failed to load chats");
      
      chats = await response.json();
      
      const chatHistoryContainer = document.getElementById("chatHistory");
      chatHistoryContainer.innerHTML = "";
      
      const ids = Object.keys(chats);
      if (ids.length === 0) {
        createChat();
        return;
      }
      
      for (const id in chats) {
        const title = chats[id].title || "New Chat";
        chatHistoryContainer.insertAdjacentHTML("afterbegin",
          `<div class="list-group-item d-flex justify-content-between align-items-center"
               data-chat-id="${id}">
            <span class="chat-title text-truncate" style="cursor:pointer;">
              💬 ${title}
            </span>
            <i class="bi bi-trash text-success delete-chat" style="cursor:pointer;"></i>
          </div>`
        );
      }
      
      const firstId = ids[ids.length - 1]; // Try the last one added
      setActiveChat(firstId);
      renderMessages(firstId);
    } catch (e) {
      console.error(e);
      chats = {};
      createChat();
    }
  }

  loadChats();
</script>

{% endblock %}
